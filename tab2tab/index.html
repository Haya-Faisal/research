<!-- index.html -->
<!DOCTYPE html>
<html>
<head><title>WebRTC Test</title></head>
<body>
  <video id="localVideo" autoplay playsinline muted width="300"></video>
  <video id="remoteVideo" autoplay playsinline width="300"></video>
  <p id="status">Connecting to signaling server...</p>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const room = "test-room"; // both tabs join the same room
    const socket = io("http://localhost:3000");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const status = document.getElementById("status");

    const config = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };
    const pc = new RTCPeerConnection(config);

    let localStream;

    async function start() {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      socket.emit("join", room);
      status.textContent = "Waiting for peer...";
    }

   
    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      status.textContent = "Connected!";
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        socket.emit("ice-candidate", { room, candidate: event.candidate });
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log("ICE state:", pc.iceConnectionState);
    };

    socket.on("peer-joined", async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("offer", { room, offer });
    });

    socket.on("offer", async (offer) => {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("answer", { room, answer });
    });

    socket.on("answer", async (answer) => {
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on("ice-candidate", async (candidate) => {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.error("Error adding ICE candidate:", err);
      }
    });

    start();
  </script>
</body>
</html>
